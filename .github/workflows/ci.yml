name: ci

# On demand only: gh workflow run <this file> --ref <branch>. Nothing runs by
# itself on pull requests or pushes; deploys and releases run their own checks.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile
        run: python3 -m py_compile $(git ls-files '*.py')
      - name: Evidence matrix template is valid
        run: python3 skills/testing-strategy/scripts/validate_evidence_matrix.py skills/testing-strategy/assets/evidence-matrix.csv
